generator_learning_rate: [0.00005]
discriminator_learning_rate: [0.00005]
optimizer_name: ["AdamW"]
lr: [0.00005]
num_epochs: 150
num_trials: 100
random_seed: 12345
batch_size_train: [1]
batch_size_sample: [1]
n_train_samples: [37]
n_test_samples: 0
train_samples_ratio: 1.0
val_samples_ratio: 0.12
sampler_class: BruteForceSampler
train: True
normalize_input: False
log_input: False
accumulate_grad_batches: 4
use_checkpoint: False
precision: "bf16-mixed"
gradient_clip: False
model_config: [{
"stage": 1,
###########################
# Encoder-Decoder config  #
###########################
"ed_config": {
"base_channels": 8, #128, # All channel sizes are scaled versions of this.
"double_z": False,
"resolution": 32,
"z_channels": 32,
"in_channels": 1, # grayscale = 1, same as out channel
"channel_mults": [1, 2, 4, 8], # Tuple that controls how the number of channels grows at each resolution level (e.g., (1, 2, 4, 8) results in channel sizes ch, 2*ch, 4*ch, 8*ch).
"num_res_blocks": 3, # Number of residual blocks per resolution level.
"attn_resolutions": [],
"use_attention": False, #[8],
"dropout": 0.0, # Dropout rate for regularization inside ResnetBlocks.
"quantizer_ema": "EMA",
"out_activation": "tanh"
},
#############
# VQ config #
#############
vq_config: {
"num_embed": 16384,
"dim_embed": 4,
 "beta": 0.25},
###############
# Loss config #
###############
loss_config: {
"target":models.vqgan.vq_loss.VQLPIPSWithDiscriminator,
"params": {
"LPIPS_type": "medical_diffusion",
"discriminator_type": "NLayerDiscriminator",
"disc_conditional": False,
"disc_in_channels": 1,
"disc_num_layers": 3,
"disc_num_filters": 32,
"disc_loss": "hinge",
"disc_start": 1000,
"disc_ramp_duration": 2600,
"codebook_weight": 0.25,
"pixelloss_weight": 1,
"g_loss_weight": 0.05,
"disc_dropout_prob": 0.0,
"disc_spectral_norm": 'all',
"disc_norm_type": 'instance'}}
}]
clear_discriminator: True
callbacks: ["Checkpoints_every_5"] 
beta_scheduler_type: linear
data_file_name: "lumbopelvic_masked_normed_global_clip_resampled_32_32_32.npz"
model_class_name: VQGAN
weighted_mask_loss: True
mlflow_config: {
"tracking_uri": "mlflow_runs",
"experiment_name": "vqgan_tuning"
}
save_top_k: 3
model_checkpoint_filename: "model-epoch{epoch:02d}"

